name: Fetch hiring posts

on:
  schedule:
    # Every 2 hours (GitHub can delay or skip scheduled runs, so run often to keep posts.json fresh)
    - cron: "47 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ddgs requests
      - run: python fetch_posts.py
      - name: Commit posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Update posts.json" || echo "No changes"
          git pull --rebase
          git push
