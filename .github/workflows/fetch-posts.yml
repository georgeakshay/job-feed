name: Fetch hiring posts

on:
  schedule:
    # ~45 min before the Claude task (08:41, 12:41, 17:41 Dubai = 04:41, 08:41, 13:41 UTC)
    - cron: "55 3,7,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ddgs requests
      - run: python fetch_posts.py
      - name: Commit posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Update posts.json" || echo "No changes"
          git pull --rebase
          git push
