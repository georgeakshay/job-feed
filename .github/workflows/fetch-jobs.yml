name: Fetch jobs

on:
  schedule:
    # ~45 min before the Claude task (05:55, 12:55, 18:55 Dubai = 01:55, 08:55, 14:55 UTC)
    - cron: "10 1,8,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-jobspy
      - run: python fetch_jobs.py
      - name: Commit jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "Update jobs.json" || echo "No changes"
          git push
